<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="860" height="250" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6f80"/></marker>
  </defs>
  <!-- clock -->
  <rect x="24" y="52" width="210" height="130" rx="18" fill="#15122e"/>
  <text x="129" y="88" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Sat</text>
  <text x="129" y="116" text-anchor="middle" font-size="13" fill="#b8bed0">drži BOOT, pitaj naglas</text>
  <text x="129" y="136" text-anchor="middle" font-size="13" fill="#b8bed0">odgovor kao tekst</text>
  <text x="129" y="164" text-anchor="middle" font-size="12" fill="#9b8cff">credentials.h</text>
  <!-- worker -->
  <rect x="325" y="52" width="210" height="130" rx="18" fill="#f6821f"/>
  <text x="430" y="88" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Cloudflare Worker</text>
  <text x="430" y="116" text-anchor="middle" font-size="13" fill="#fff4ea">tvoj, besplatan</text>
  <text x="430" y="136" text-anchor="middle" font-size="13" fill="#fff4ea">provjerava ključ uređaja</text>
  <text x="430" y="164" text-anchor="middle" font-size="12" fill="#ffffff">GEMINI_API_KEY · DEVICE_TOKEN</text>
  <!-- gemini -->
  <rect x="626" y="52" width="210" height="130" rx="18" fill="#1a73e8"/>
  <text x="731" y="88" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Google Gemini</text>
  <text x="731" y="116" text-anchor="middle" font-size="13" fill="#e3edff">razumije pitanje</text>
  <text x="731" y="136" text-anchor="middle" font-size="13" fill="#e3edff">piše kratak odgovor</text>
  <text x="731" y="164" text-anchor="middle" font-size="12" fill="#ffffff">+ Google Search</text>
  <!-- arrows -->
  <line x1="238" y1="92" x2="320" y2="92" stroke="#6b6f80" stroke-width="2" marker-end="url(#a)"/>
  <line x1="320" y1="142" x2="238" y2="142" stroke="#6b6f80" stroke-width="2" marker-end="url(#a)"/>
  <line x1="539" y1="92" x2="621" y2="92" stroke="#6b6f80" stroke-width="2" marker-end="url(#a)"/>
  <line x1="621" y1="142" x2="539" y2="142" stroke="#6b6f80" stroke-width="2" marker-end="url(#a)"/>
  <text x="279" y="40" text-anchor="middle" font-size="12" fill="#3c4043">snimka + ključ uređaja</text>
  <text x="279" y="206" text-anchor="middle" font-size="12" fill="#3c4043">odgovor</text>
  <text x="580" y="40" text-anchor="middle" font-size="12" fill="#3c4043">zvuk + razgovor</text>
  <text x="580" y="206" text-anchor="middle" font-size="12" fill="#3c4043">odgovor</text>
  <text x="430" y="236" text-anchor="middle" font-size="12" fill="#6b6f80">Gemini ključ nikad ne napušta Cloudflare. Sat zna samo adresu Workera i ključ uređaja.</text>
</svg>
