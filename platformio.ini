; Waveshare ESP32-S3-Touch-AMOLED-1.8 — clock and weather station
;
; Same two panel variants as the chat-stick waveshare firmware:
;   waveshare-v1  — original board, SH8601 panel
;   waveshare-v2  — V2 board, CO5300 panel (label on the back says "V2")
;
;   pio run -e waveshare-v2 -t upload
[platformio]
default_envs = waveshare-v2

[weather]
platform = espressif32
; Generic ESP32-S3 board id that every espressif32 platform version ships,
; overridden below for this module: 16 MB QIO flash + 8 MB octal PSRAM.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

lib_deps =
    lewisxhe/XPowersLib@^0.3.3
    bblanchon/ArduinoJson@^7.0.0

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Isrc
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101

; V1 needs the SH8601 driver from GFX Library 1.6+, which requires
; Arduino-ESP32 core 3.x (e.g. the pioarduino platform). Untested.
[env:waveshare-v1]
extends = weather
lib_deps =
    ${weather.lib_deps}
    moononournation/GFX Library for Arduino@^1.6.5
build_flags =
    ${weather.build_flags}
    -DWAVESHARE_PANEL_SH8601

; V2 (CO5300). GFX Library 1.5.9 is the last release that builds on the
; Arduino-ESP32 2.0.x core the stock espressif32 platform ships.
[env:waveshare-v2]
extends = weather
lib_deps =
    ${weather.lib_deps}
    moononournation/GFX Library for Arduino@1.5.9
build_flags =
    ${weather.build_flags}
    -DWAVESHARE_PANEL_CO5300
